<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <meta name="description" content="霓虹风格贪吃蛇小游戏，支持键盘和触屏操作。">
  <title>霓虹贪吃蛇</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="game-shell">
    <header class="topbar">
      <div class="brand" aria-label="霓虹贪吃蛇">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" role="img">
            <path d="M8 12h11v5H13v6h7v5H8z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="27" cy="12" r="4" fill="currentColor"/>
            <circle cx="25.5" cy="11" r="1.2" fill="#071018"/>
          </svg>
        </div>
        <div>
          <p class="eyebrow">ARCADE // 01</p>
          <h1>霓虹贪吃蛇</h1>
        </div>
      </div>

      <button id="soundBtn" class="icon-button sound-button" type="button" aria-label="关闭音效" title="关闭音效">
        <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path d="M16 8.5a5 5 0 0 1 0 7M18.7 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path d="m17 9 4 4m0-4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <section class="scoreboard" aria-label="游戏数据">
      <article class="stat-card">
        <span class="stat-label">当前得分</span>
        <strong id="scoreValue" class="stat-value">000</strong>
      </article>
      <article class="stat-card stat-card-accent">
        <span class="stat-label">最高纪录</span>
        <strong id="bestValue" class="stat-value">000</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">速度等级</span>
        <strong id="speedValue" class="stat-value">1.0x</strong>
      </article>
    </section>

    <section class="mode-switch" aria-label="游戏模式">
      <span class="mode-switch-label">游戏模式</span>
      <div class="mode-switch-group" role="group" aria-label="选择游戏模式">
        <button id="modeClassic" class="mode-button is-active" type="button" data-mode="classic" aria-pressed="true">经典模式</button>
        <button id="modeObstacles" class="mode-button" type="button" data-mode="obstacles" aria-pressed="false">障碍模式</button>
      </div>
    </section>

    <section class="game-panel" aria-label="游戏区域">
      <div class="board-wrap">
        <canvas id="gameCanvas" tabindex="0" aria-label="贪吃蛇游戏棋盘"></canvas>
        <div class="board-scanline" aria-hidden="true"></div>

        <div id="gameOverlay" class="game-overlay">
          <div class="overlay-content">
            <p id="overlayKicker" class="overlay-kicker">ARCADE // READY</p>
            <h2 id="overlayTitle">准备出发</h2>
            <p id="overlayText" class="overlay-text">吞下能量核心，别撞上边界或自己的身体。</p>
            <div id="overlayStats" class="overlay-stats" hidden>
              <div>
                <span>本局得分</span>
                <strong id="finalScoreValue">000</strong>
              </div>
              <div>
                <span>最高纪录</span>
                <strong id="finalBestValue">000</strong>
              </div>
            </div>
            <button id="primaryBtn" class="primary-button" type="button">
              <span>开始游戏</span>
              <span class="button-arrow" aria-hidden="true">→</span>
            </button>
            <p class="overlay-hint">方向键 / WASD 移动 · 空格暂停</p>
          </div>
        </div>
      </div>

      <div class="game-toolbar">
        <div class="status" aria-live="polite">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">等待开始</span>
        </div>
        <div class="toolbar-actions">
          <span class="keyboard-hint"><kbd>SPACE</kbd> 暂停</span>
          <button id="pauseBtn" class="toolbar-button" type="button">开始</button>
        </div>
      </div>
    </section>

    <section class="touch-controls" aria-label="触屏方向控制">
      <button class="direction-button direction-up" type="button" data-direction="up" aria-label="向上">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="direction-button direction-left" type="button" data-direction="left" aria-label="向左">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="direction-button direction-down" type="button" data-direction="down" aria-label="向下">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="direction-button direction-right" type="button" data-direction="right" aria-label="向右">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <section class="how-to-play" aria-label="玩法说明">
      <div class="tip-item">
        <span class="tip-number">01</span>
        <p><strong>收集核心</strong>每个能量核心增加 10 分和 1 节身体。</p>
      </div>
      <div class="tip-item">
        <span class="tip-number">02</span>
        <p><strong>逐渐加速</strong>吃得越多，移动速度越快，最高 2.3 倍。</p>
      </div>
      <div class="tip-item">
        <span class="tip-number">03</span>
        <p><strong>避免碰撞</strong>撞墙或撞到自己都会结束游戏。</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">新纪录！</div>

  <script src="game.js" defer></script>
</body>
</html>
